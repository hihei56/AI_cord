name: Deploy to VPS
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  # 本番に出す前にテストを走らせる。失敗したらdeployは実行されない
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 217.142.252.151
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/ubuntu/AI_cord
            git fetch origin
            git reset --hard origin/main
            npm install --omit=dev
            pm2 restart ai_cord mealpost
