name: Deploy to VPS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 217.142.252.151
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/ubuntu/AI_cord
            git fetch origin
            git reset --hard origin/main
            npm install --omit=dev
            pm2 restart ai_cord mealpost
